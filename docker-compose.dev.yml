services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-va-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides to force docker-network hostnames regardless of what .env
      # contains, so ACIF_*/OPENROUTER_*/RAG_*/etc. from .env still reach the
      # container while connection targets stay pinned to compose service names.
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://assistant_user:assistant_password@postgres:5432/assistant_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=assistant_neo4j_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      neo4j:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      # Persist uploaded/synced raw documents across container recreates
      - backend_data:/app/data
    networks:
      - campus-va-network
    restart: on-failure

  celery-worker:
    # Executes the 24h official-document sync task (app/workers/tasks.py, scheduled by
    # celery-beat below) — kept separate from `backend` so local dev matches the production
    # topology (see docker-compose.prod.yml for why), and separate from celery-beat so the
    # schedule has exactly one source of truth regardless of worker replica count.
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-va-celery-worker
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://assistant_user:assistant_password@postgres:5432/assistant_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=assistant_neo4j_password
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    # The inherited Dockerfile HEALTHCHECK probes port 8000, which nothing listens on here (this
    # container runs a Celery worker, not uvicorn) — overridden with Celery's own liveness probe.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - backend_data:/app/data
    networks:
      - campus-va-network
    restart: on-failure

  celery-beat:
    # Schedules the periodic sync task onto celery-worker via Redis — must stay a single
    # instance (never scaled), since duplicate beat processes would double-fire the schedule.
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-va-celery-beat
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://assistant_user:assistant_password@postgres:5432/assistant_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=assistant_neo4j_password
    command: celery -A app.celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule
    # inspect ping (used for celery-worker above) tests the task-consuming worker, not the beat
    # scheduler process itself — a hung beat with a healthy worker would still ping fine even
    # though nothing would ever be scheduled again. Beat rewrites its schedule file's mtime on
    # every tick (well under a minute by default), so a stale mtime reliably means beat is hung.
    healthcheck:
      test: ["CMD-SHELL", "find /app/data/celerybeat-schedule -mmin -5 2>/dev/null | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - backend_data:/app/data
    networks:
      - campus-va-network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus-va-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - campus-va-network
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    container_name: campus-va-postgres
    environment:
      - POSTGRES_DB=assistant_db
      - POSTGRES_USER=assistant_user
      - POSTGRES_PASSWORD=assistant_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus-va-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: campus-va-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - campus-va-network
    restart: unless-stopped

  chroma:
    # Pinned 2026-07-22 to the same digest as production (see docker-compose.prod.yml) —
    # zero behavior change, dev and prod now stay in lockstep on this image.
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: campus-va-chroma
    ports:
      - "8001:8000"
    # This image persists to /data by default, not /chroma/chroma — see
    # docker-compose.prod.yml's comment on this same setting for the full explanation.
    volumes:
      - chroma_data:/data
    networks:
      - campus-va-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: campus-va-neo4j
    environment:
      - NEO4J_AUTH=neo4j/assistant_neo4j_password
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/browser/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - neo4j_data:/var/lib/neo4j/data
    networks:
      - campus-va-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  neo4j_data:
  backend_data:

networks:
  campus-va-network:
    driver: bridge

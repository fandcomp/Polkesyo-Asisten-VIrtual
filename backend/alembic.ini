# Alembic Configuration File
# Revision identification: alembic
# Revision format: (%%)rev [%%(branch_label)s][%%(depends_on)s]

[alembic]
# Database URL is loaded from app.core.config.settings.database_url in env.py
# Do not set sqlalchemy.url here - it will be populated by app configuration
sqlalchemy.echo = false
sqlalchemy.echo_pool = false
sqlalchemy.max_overflow = -1
sqlalchemy.pool_size = 5
sqlalchemy.pool_pre_ping = true
sqlalchemy.pool_recycle = 3600

script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = :
version_locations = %(here)s/app/db/migrations/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

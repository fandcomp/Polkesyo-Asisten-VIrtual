[project]
name = "campus-virtual-assistant"
version = "0.1.0"
description = "Production-ready Campus Virtual Assistant for Poltekkes Kemenkes Yogyakarta using FastAPI, OpenRouter, and ACIF context integrity"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Poltekkes Kemenkes Yogyakarta" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "redis[asyncio]>=5.2.0",
    "chromadb>=0.5.20",
    "neo4j>=5.26.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.6",
    "opencv-python-headless>=4.9.0",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
    "bcrypt>=4.1.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0.0",
    "scipy>=1.14.0",
    "celery[redis]>=5.4,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
